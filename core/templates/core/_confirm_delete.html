{% load i18n %}
<form method="post" action="{{ form_action }}" class="modal-form">
    {% csrf_token %}
    <div class="{{ ui.modal_header }}">
        <h2 class="{{ ui.modal_title }}">{{ modal_title }}</h2>
        <button type="button" class="{{ ui.icon_button }}" data-modal-close aria-label="{% trans 'Close' %}">&times;</button>
    </div>
    <div class="{{ ui.modal_content }}">
        <p>{% blocktrans with name=object %}Are you sure you want to delete <strong>{{ name }}</strong>? This cannot be undone.{% endblocktrans %}</p>
        {% if warning %}<p class="mt-2 font-medium text-red-700">{{ warning }}</p>{% endif %}
    </div>
    <div class="{{ ui.modal_footer }}">
        <button type="button" class="{{ ui.btn_secondary }}" data-modal-close>{% trans "Cancel" %}</button>
        <button type="submit" class="{{ ui.btn_danger }}">{% trans "Delete" %}</button>
    </div>
</form>
