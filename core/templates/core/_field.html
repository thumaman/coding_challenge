<div class="field{% if field.errors %} has-error{% endif %}{% if field.field.widget.input_type == 'checkbox' %} field-check{% endif %}{% if field.field.widget.attrs.wide %} field-wide{% endif %}" data-field="{{ field.name }}">
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="req">*</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<small class="help">{{ field.help_text }}</small>{% endif %}
    {% for error in field.errors %}<small class="error">{{ error }}</small>{% endfor %}
</div>
